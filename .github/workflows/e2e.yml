name: Desktop E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  GRAYSLATE_E2E_LOCALE: en_US.UTF-8
  TAURI_DRIVER_VERSION: 2.0.6

jobs:
  static:
    name: E2E contracts and coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check, lint, and audit the E2E suite
        run: pnpm run e2e:check
      - name: Test release-build verification
        run: pnpm run test:verify-release-build

  build-e2e:
    name: Build test-only packaged app
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Configure Rust compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.15.0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build E2E binary
        run: pnpm run e2e:build
      - name: Install pinned Tauri WebDriver bridge
        run: |
          cargo install tauri-driver --version "${TAURI_DRIVER_VERSION}" --locked --root "${RUNNER_TEMP}/tauri-driver"
          cp "${RUNNER_TEMP}/tauri-driver/bin/tauri-driver" target/release/tauri-driver
      - name: Report Rust compiler cache statistics
        if: always()
        run: '"${SCCACHE_PATH}" --show-stats'
      - name: Upload E2E binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grayslate-e2e-binary
          path: |
            target/release/Grayslate
            target/release/tauri-driver
          if-no-files-found: error
          retention-days: 1

  functional:
    name: Linux functional
    needs: build-e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends locales openbox webkit2gtk-driver x11-utils xclip xvfb
          sudo locale-gen "${GRAYSLATE_E2E_LOCALE}"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Download E2E binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grayslate-e2e-binary
          path: target/release
      - name: Prepare E2E runtime
        run: |
          chmod +x target/release/Grayslate target/release/tauri-driver
          echo "TAURI_DRIVER_PATH=${GITHUB_WORKSPACE}/target/release/tauri-driver" >> "${GITHUB_ENV}"
          echo "runner image: ${ImageOS} ${ImageVersion}"
          . /etc/os-release
          echo "linux: ${PRETTY_NAME}"
          dpkg-query -W openbox webkit2gtk-driver x11-utils xclip xvfb
          locale -a | grep -i '^en_US\.utf8$'
      - name: Run functional packaged E2E
        run: pnpm run e2e:ci:functional
      - name: Upload functional results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grayslate-e2e-functional-results
          path: .e2e-tmp/workers/*/artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Repeat timing-sensitive lifecycle specs
        id: stability
        run: pnpm run e2e:ci:stability
      - name: Upload stability results
        if: steps.stability.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grayslate-e2e-stability-results
          path: .e2e-tmp/workers/*/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Linux security boundary
    needs: build-e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends locales openbox webkit2gtk-driver x11-utils xclip xvfb
          sudo locale-gen "${GRAYSLATE_E2E_LOCALE}"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Download E2E binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grayslate-e2e-binary
          path: target/release
      - name: Prepare E2E runtime
        run: |
          chmod +x target/release/Grayslate target/release/tauri-driver
          echo "TAURI_DRIVER_PATH=${GITHUB_WORKSPACE}/target/release/tauri-driver" >> "${GITHUB_ENV}"
          echo "runner image: ${ImageOS} ${ImageVersion}"
          . /etc/os-release
          echo "linux: ${PRETTY_NAME}"
          dpkg-query -W openbox webkit2gtk-driver x11-utils xclip xvfb
          locale -a | grep -i '^en_US\.utf8$'
      - name: Run packaged security E2E
        run: pnpm run e2e:ci:security
      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grayslate-e2e-security-results
          path: .e2e-tmp/workers/*/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Linux visual (advisory)
    needs: build-e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends locales openbox webkit2gtk-driver x11-utils xclip xvfb
          sudo locale-gen "${GRAYSLATE_E2E_LOCALE}"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Download E2E binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grayslate-e2e-binary
          path: target/release
      - name: Prepare E2E runtime
        run: |
          chmod +x target/release/Grayslate target/release/tauri-driver
          echo "TAURI_DRIVER_PATH=${GITHUB_WORKSPACE}/target/release/tauri-driver" >> "${GITHUB_ENV}"
          echo "runner image: ${ImageOS} ${ImageVersion}"
          . /etc/os-release
          echo "linux: ${PRETTY_NAME}"
          dpkg-query -W openbox webkit2gtk-driver x11-utils xclip xvfb
          locale -a | grep -i '^en_US\.utf8$'
      - name: Run visual packaged E2E
        run: pnpm run e2e:ci:visual
      - name: Upload visual results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grayslate-e2e-visual-results
          path: .e2e-tmp/workers/*/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  release-surface:
    name: Normal release excludes E2E surface
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Configure Rust compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.15.0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build normal release binary in an isolated target
        run: CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/release-audit" pnpm tauri build --no-bundle
      - name: Report Rust compiler cache statistics
        if: always()
        run: '"${SCCACHE_PATH}" --show-stats'
      - name: Verify test-only backend and frontend surfaces are absent
        run: pnpm run verify:release-build target/release-audit/release/Grayslate
